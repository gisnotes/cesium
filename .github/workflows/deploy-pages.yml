name: Deploy to GitHub Pages

on:
  push:
    branches:
      - zhcn
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Build Cesium
        run: npm run build

      - name: Build Sandcastle
        run: npx gulp -f gulpfile.apps.js buildSandcastle --no-embeddings --outer-origin="https://gisnotes.github.io"

      - name: Clean up node_modules before artifact packaging
        run: rm -rf node_modules .git

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
